# Isolated AIP-5401/AIP-5403 route fixture for the agentruntime-dev test cluster.
# Apply only after confirming the existing LAS stable Service and creating a
# temporary aip5401-ecr-pull Secret from a fresh ECR token.
# This workload has a unique name and is intentionally not owned by an AIService.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aip5401-slim-candidate-config
  namespace: ai-platform
  labels:
    validation.splunk.com/story: aip-5401-5403
data:
  DEPLOYMENT_TYPE: AITIER
  SERVICE_NAME: slim-api
  SERVICE_INTERNAL_NAME: SLIM
  SPLUNK_ISSUERS: https://splunk-splunk-standalone-standalone-service.ai-platform.svc.cluster.local:8089
  ENABLE_AUTHN: "true"
  ENABLE_AUTHZ: "true"
  API_VERSION: v1alpha1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aip5401-slim-candidate-feature-config
  namespace: ai-platform
  labels:
    validation.splunk.com/story: aip-5401-5403
data:
  features_config.yaml: |
    customization:
      enabled_by_default: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aip5401-slim-candidate
  namespace: ai-platform
  labels:
    validation.splunk.com/story: aip-5401-5403
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aip5401-slim-candidate
  template:
    metadata:
      labels:
        app: aip5401-slim-candidate
        validation.splunk.com/story: aip-5401-5403
    spec:
      imagePullSecrets:
        - name: aip5401-ecr-pull
      containers:
        - name: slim-api
          image: 658391232643.dkr.ecr.us-west-2.amazonaws.com/ml-platform/slim-api:feature-las-202610152102-b7cb6e97e381@sha256:951ac687c0753399e9a636cd507ec541f55ecaade4717c19276d228115c003ef
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: aip5401-slim-candidate-config
          env:
            - name: AGENT_SERVER_URL
              value: http://agentruntime-dev-ai-platform-agentruntime-mltk-svc.ai-platform.svc.cluster.local:8080
            - name: LAS_GRAPH_ID
              value: echo
            - name: TLS_DISABLED
              value: "true"
          volumeMounts:
            - name: feature-config
              mountPath: /etc/config
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
      volumes:
        - name: feature-config
          configMap:
            name: aip5401-slim-candidate-feature-config
---
apiVersion: v1
kind: Service
metadata:
  name: aip5401-slim-candidate
  namespace: ai-platform
  labels:
    validation.splunk.com/story: aip-5401-5403
spec:
  type: ClusterIP
  selector:
    app: aip5401-slim-candidate
  ports:
    - name: http
      port: 8080
      targetPort: http
